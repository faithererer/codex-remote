name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/audit-source.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p android assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain
      - name: Save Android debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: codex-remote-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Explain APK download and signing
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo '### Android 调试 APK'
            echo "[下载本次构建的 APK 压缩包]($ARTIFACT_URL)，解压后得到 app-debug.apk。"
            echo '这是开发签名，不能覆盖正式发行 APK；不要卸载带有配对数据的正式版来安装它。'
            echo '正式更新使用 Android Release 工作流，需要配置原发行者签名的 GitHub Secrets。'
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish windows/CodexRemote.csproj -c Release -r win-x64 --self-contained true -o dist/windows --nologo
      - name: Run isolated self-tests
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'codex-remote-self-tests.json'
          $process = Start-Process -FilePath (Resolve-Path 'dist/windows/CodexRemote.exe') -ArgumentList @('--self-test', ('"' + $output + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $output)) { throw 'Self-test process failed' }
          $tests = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
          $failed = @($tests.results | Where-Object { !$_.passed })
          if ($failed.Count -gt 0) { $failed | Format-List; throw 'Self-tests failed' }
          Write-Output "$($tests.results.Count) self-tests passed; no live desktop commands sent."
