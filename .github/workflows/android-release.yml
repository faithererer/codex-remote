# 作者：xxx
name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本标签，例如 v0.1.5'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SIGNER_SHA256: ff5809395a68cc7b3920b8302f1121491c3b0ea4d874ee0a2e945e790f718d12
    steps:
      - name: Resolve version tag
        id: version
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::必须提供形如 v0.1.5 的现有版本标签'
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false
      - name: Check release version and signing configuration
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CODEX_SIGNING_STORE_BASE64: ${{ secrets.CODEX_SIGNING_STORE_BASE64 }}
          CODEX_SIGNING_PASSWORD: ${{ secrets.CODEX_SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          source = pathlib.Path('android/app/build.gradle.kts').read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1)
          if version != os.environ['RELEASE_VERSION']:
              raise SystemExit('版本标签与 Android versionName 不一致')
          PY
          test -f "docs/RELEASE-$RELEASE_VERSION.md"
          if [[ -z "$CODEX_SIGNING_STORE_BASE64" || -z "$CODEX_SIGNING_PASSWORD" ]]; then
            echo '::error::请在仓库 Settings → Secrets and variables → Actions 配置原发行签名 CODEX_SIGNING_STORE_BASE64 和 CODEX_SIGNING_PASSWORD；不能用新签名覆盖旧版'
            exit 1
          fi
          node tools/audit-source.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore signing key in temporary storage
        env:
          CODEX_SIGNING_STORE_BASE64: ${{ secrets.CODEX_SIGNING_STORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$CODEX_SIGNING_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codex-remote-release.jks"
      - name: Build and test signed Android APK
        env:
          CODEX_SIGNING_STORE: ${{ runner.temp }}/codex-remote-release.jks
          CODEX_SIGNING_PASSWORD: ${{ secrets.CODEX_SIGNING_PASSWORD }}
        run: gradle -p android assembleRelease testReleaseUnitTest lintRelease --no-daemon --console=plain
      - name: Verify original signer and prepare APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-verification.txt"
          if ! grep -Fxq "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" "$RUNNER_TEMP/apk-verification.txt"; then
            echo '::error::APK 签名与已发行版本不同，拒绝发布无法覆盖升级的安装包'
            exit 1
          fi
          mkdir -p dist/android-release
          cp android/app/build/outputs/apk/release/app-release.apk "dist/android-release/codex-remote-$RELEASE_VERSION-android.apk"
          cp LICENSE dist/android-release/
          (cd dist/android-release && sha256sum "codex-remote-$RELEASE_VERSION-android.apk" LICENSE > SHA256SUMS-android.txt)
      - name: Save signed Android package
        uses: actions/upload-artifact@v4
        with:
          name: codex-remote-android-release-${{ steps.version.outputs.tag }}
          path: dist/android-release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | [.tag_name, (.assets | map(.name) | join(","))] | @tsv' > "$RUNNER_TEMP/releases.tsv"
          existing=$(awk -F '\t' -v tag="$RELEASE_TAG" '$1 == tag { print $1 "," $2 }' "$RUNNER_TEMP/releases.tsv")
          apk="codex-remote-$RELEASE_VERSION-android.apk"
          manifest=dist/android-release/SHA256SUMS.txt
          : > "$manifest"
          if [[ -n "$existing" && ",$existing," == *",SHA256SUMS.txt,"* ]]; then
            gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/previous-release"
            awk -v apk="$apk" '$2 != apk && $2 != "LICENSE" { print }' "$RUNNER_TEMP/previous-release/SHA256SUMS.txt" > "$manifest"
          fi
          cat dist/android-release/SHA256SUMS-android.txt >> "$manifest"
          if [[ -n "$existing" ]]; then
            gh release upload "$RELEASE_TAG" "dist/android-release/$apk" "$manifest" dist/android-release/LICENSE --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease \
              --title "Codex 随行 $RELEASE_VERSION · Preview" --notes-file "docs/RELEASE-$RELEASE_VERSION.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --prerelease \
              --title "Codex 随行 $RELEASE_VERSION · Preview" --notes-file "docs/RELEASE-$RELEASE_VERSION.md" \
              "dist/android-release/$apk" "$manifest" dist/android-release/LICENSE
          fi
          gh release view "$RELEASE_TAG" --json url,isDraft,assets \
            --jq '{url, isDraft, assets: [.assets[] | {name, state}]}'
          echo "### Android $RELEASE_VERSION 已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "[下载 APK](https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$apk)" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/codex-remote-release.jks"
